spring.application.name=invoice-service
server.port=8083

# PostgreSQL - dedicated DB instance
spring.datasource.url=jdbc:postgresql://invoice-postgres:5432/invoice_db
spring.datasource.username=b2b
spring.datasource.password=b2b123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Tomcat
server.tomcat.max-threads=400
server.tomcat.max-connections=20000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# Feign client URLs
partner.service.url=http://partner-service:8081
order.service.url=http://order-service:8082

# Actuator / Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
